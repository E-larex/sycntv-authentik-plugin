name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout synctv
        uses: actions/checkout@v4
        with:
          repository: synctv-org/synctv
          path: synctv

      - name: Replace plugin directory
        run: |
          rm -rf synctv/internal/provider/plugins/authentik
          mkdir -p synctv/internal/provider/plugins/authentik
          rsync -a --exclude '.git' plugin/ synctv/internal/provider/plugins/authentik/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: synctv/go.mod

      - name: Build plugin
        working-directory: synctv
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build \
            -o dist/authentik-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./internal/provider/plugins/authentik

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: authentik-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: synctv/dist/authentik-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: false
